<body>

      </div>


      <!-- TARJETA 2 -->
      <div class="tarjeta" onclick="abrirMensaje(
        '🌟 Un recuerdo especial',

        <div class="texto">

        </div>

      )">

        <div class="texto">
          Presiona para abrir un recuerdo ❤️
        </div>

      </div>

    </div>

  </div>


  <!-- POPUP -->
  <div class="popup" id="popup">

    <div class="mensaje">

      <h2 id="tituloMensaje"></h2>

      <p id="textoMensaje"></p>

      <button onclick="cerrarMensaje()">
        Cerrar

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
